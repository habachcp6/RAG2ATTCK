name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep the CI toolchain reproducible; update deliberately with lockfile review.
  UV_VERSION: "0.11.24"
  UV_NO_PROGRESS: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-validation:
    name: Registry Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-suffix: registry-validation
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Validate lockfile
        run: uv lock --check --offline

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check installed dependencies
        run: uv pip check

      - name: Validate Synthetic Registry
        run: uv run python scripts/validate_synthetic_registry.py

  synthetic-tests:
    name: Synthetic Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-suffix: synthetic-tests
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Validate lockfile
        run: uv lock --check --offline

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check installed dependencies
        run: uv pip check

      - name: Run Synthetic Tests
        run: uv run python scripts/run_offline_tests.py -m pytest tests/test_synthetic.py -q

  full-test-suite:
    name: Full Test Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-suffix: full-test-suite-${{ matrix.os }}
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Validate lockfile
        run: uv lock --check --offline

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check installed dependencies
        run: uv pip check

      - name: Acquire ATT&CK v19.2 reference
        run: uv run python -c "from pathlib import Path; from src.attack_loader import download_attack_reference; download_attack_reference(Path('.'))"

      - name: Lint T20 critical code paths
        run: uv run ruff check scripts/analyze_retrieval_failures.py tests/test_retrieval_failure_analysis.py

      - name: Run Full Test Suite
        run: uv run python scripts/run_offline_tests.py -m pytest -m "not integration" -q

      - name: Verify frozen synthetic benchmark and same-seed reproduction
        run: uv run python scripts/run_offline_tests.py -m src.data_ground_truth verify-synthetic
