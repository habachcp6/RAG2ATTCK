name: Real Retrieval Integration

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/retrieval/**"
      - "src/rag/**"
      - "src/experiment/**"
      - "src/llm/**"
      - "src/baseline/**"
      - "src/pilot/**"
      - "config/experiment_config.json"
      - "config/model.json"
      - "scripts/run_offline_tests.py"
      - "scripts/offline_guard/**"
      - "tests/test_experiment*.py"
      - "tests/test_pilot_hardening.py"
      - "tests/test_llm_client.py"
      - "tests/test_live_budget.py"
      - "tests/test_no_rag_pilot.py"
      - "tests/test_baseline_pipeline.py"
      - "src/evaluation/**"
      - "config/retrieval.json"
      - "attack/corpus/**"
      - "attack/index/**"
      - "tests/test_retriever.py"
      - "tests/test_retrieval_integrity.py"
      - "tests/test_rag_pipeline.py"
      - "tests/test_retrieval_diagnostics.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "src/attack_loader.py"
      - ".github/workflows/integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/retrieval/**"
      - "src/rag/**"
      - "src/experiment/**"
      - "src/llm/**"
      - "src/baseline/**"
      - "src/pilot/**"
      - "config/experiment_config.json"
      - "config/model.json"
      - "scripts/run_offline_tests.py"
      - "scripts/offline_guard/**"
      - "tests/test_experiment*.py"
      - "tests/test_pilot_hardening.py"
      - "tests/test_llm_client.py"
      - "tests/test_live_budget.py"
      - "tests/test_no_rag_pilot.py"
      - "tests/test_baseline_pipeline.py"
      - "src/evaluation/**"
      - "config/retrieval.json"
      - "attack/corpus/**"
      - "attack/index/**"
      - "tests/test_retriever.py"
      - "tests/test_retrieval_integrity.py"
      - "tests/test_rag_pipeline.py"
      - "tests/test_retrieval_diagnostics.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "src/attack_loader.py"
      - ".github/workflows/integration.yml"

permissions:
  contents: read

env:
  UV_VERSION: "0.11.24"
  UV_NO_PROGRESS: "1"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface

jobs:
  real-retrieval:
    name: Real Retrieval Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: real-retrieval
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Validate lockfile
        run: uv lock --check --offline

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check installed dependencies
        run: uv pip check

      - name: Acquire ATT&CK v19.2 reference
        run: uv run python -c "from pathlib import Path; from src.attack_loader import download_attack_reference; download_attack_reference(Path('.'))"

      - name: Acquire pinned embedding model before offline checks
        run: >-
          uv run python -c "import json; from sentence_transformers import SentenceTransformer;
          c=json.load(open('config/retrieval.json', encoding='utf-8'));
          SentenceTransformer(c['embedding_model_id'], revision=c['embedding_model_revision'])"

      - name: Run real retrieval integration tests without provider access
        run: uv run python scripts/run_offline_tests.py -m pytest -m integration -q
