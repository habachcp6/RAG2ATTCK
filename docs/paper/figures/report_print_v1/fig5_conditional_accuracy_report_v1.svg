<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 440" width="468" height="440">
  <defs>
    <style>
      @page { size: 468px 440px; margin: 0; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; fill: #475569; text-anchor: middle; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.0px; font-weight: bold; fill: #334155; }
      .tick-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; fill: #475569; }
      .grid-line { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 3,3; }
      .data-hit { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: bold; fill: #065f46; text-anchor: middle; }
      .data-miss { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: bold; fill: #92400e; text-anchor: middle; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; fill: #334155; }
      .subgroup-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .caveat-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; fill: #64748b; text-anchor: middle; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: bold; text-anchor: middle; }
      .stage-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; fill: #334155; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: bold; fill: #1e293b; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; fill: #475569; }
      .fixture-banner { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: bold; fill: #b91c1c; text-anchor: end; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="234" y="22" class="title">Figure 5: Downstream Attribution Accuracy Conditioned on Retrieval Success</text>
  <text x="234" y="37" class="subtitle">Comparison of P(Correct | Hit) vs. P(Correct | Miss) across RAG depths</text>
  <line x1="62" y1="75" x2="448" y2="75" class="grid-line"/>
  <text x="56" y="78" class="tick-label" style="text-anchor: end;">100%</text>
  <line x1="62" y1="119" x2="448" y2="119" class="grid-line"/>
  <text x="56" y="122" class="tick-label" style="text-anchor: end;">90%</text>
  <line x1="62" y1="163" x2="448" y2="163" class="grid-line"/>
  <text x="56" y="166" class="tick-label" style="text-anchor: end;">80%</text>
  <line x1="62" y1="207" x2="448" y2="207" class="grid-line"/>
  <text x="56" y="210" class="tick-label" style="text-anchor: end;">70%</text>
  <line x1="62" y1="251" x2="448" y2="251" class="grid-line"/>
  <text x="56" y="254" class="tick-label" style="text-anchor: end;">60%</text>
  <line x1="62" y1="295" x2="448" y2="295" class="grid-line"/>
  <text x="56" y="298" class="tick-label" style="text-anchor: end;">50%</text>
  <line x1="62" y1="75" x2="62" y2="295" stroke="#374151" stroke-width="1.5"/>
  <line x1="62" y1="295" x2="448" y2="295" stroke="#374151" stroke-width="1.5"/>
  <text x="18" y="185" class="axis-label" transform="rotate(-90 18 185)" text-anchor="middle">Conditional Accuracy (%)</text>
  <rect x="82.0" y="75.0" width="26" height="220.0" rx="3" ry="3" fill="#10b981"/>
  <rect x="112.0" y="180.1" width="26" height="114.9" rx="3" ry="3" fill="#f59e0b"/>
  <text x="95.0" y="70.0" class="data-hit">100.0%</text>
  <text x="125.0" y="175.1" class="data-miss">76.1%</text>
  <text x="110.0" y="312" class="tick-label" font-weight="bold" text-anchor="middle">k=1</text>
  <rect x="178.5" y="86.2" width="26" height="208.8" rx="3" ry="3" fill="#10b981"/>
  <rect x="208.5" y="185.7" width="26" height="109.3" rx="3" ry="3" fill="#f59e0b"/>
  <text x="191.5" y="81.2" class="data-hit">97.5%</text>
  <text x="221.5" y="180.7" class="data-miss">74.8%</text>
  <text x="206.5" y="312" class="tick-label" font-weight="bold" text-anchor="middle">k=3</text>
  <rect x="275.0" y="87.7" width="26" height="207.3" rx="3" ry="3" fill="#10b981"/>
  <rect x="305.0" y="193.7" width="26" height="101.3" rx="3" ry="3" fill="#f59e0b"/>
  <text x="288.0" y="82.7" class="data-hit">97.1%</text>
  <text x="318.0" y="188.7" class="data-miss">73.0%</text>
  <text x="303.0" y="312" class="tick-label" font-weight="bold" text-anchor="middle">k=5</text>
  <rect x="371.5" y="113.4" width="26" height="181.6" rx="3" ry="3" fill="#10b981"/>
  <rect x="401.5" y="206.9" width="26" height="88.1" rx="3" ry="3" fill="#f59e0b"/>
  <text x="384.5" y="108.4" class="data-hit">91.3%</text>
  <text x="414.5" y="201.9" class="data-miss">70.0%</text>
  <text x="399.5" y="312" class="tick-label" font-weight="bold" text-anchor="middle">k=10</text>
  <rect x="105" y="328" width="12" height="12" rx="2" fill="#10b981"/>
  <text x="123" y="338" class="legend-text">P(Correct | Retrieval Hit)</text>
  <rect x="270" y="328" width="12" height="12" rx="2" fill="#f59e0b"/>
  <text x="288" y="338" class="legend-text">P(Correct | Retrieval Miss)</text>
  <text x="234" y="366" class="subgroup-text">k=10 Subgroups: Retrieved N=321 (91.28%, 293/321) | Missed N=397 (70.03%, 278/397)</text>
  <text x="234" y="390" class="caveat-text">* Disclaimer: Subgroup differences are observational (association-only);</text>
  <text x="234" y="406" class="caveat-text">retrieval hit/miss is not randomly assigned.</text>
</svg>
