[project]
name = "rag2attck"
version = "0.1.0"
description = "RAG2ATTCK: Data & Ground Truth Pipeline for Windows Endpoint Log Attribution"
readme = "README.md"
requires-python = ">=3.13.0"
dependencies = [
    "faiss-cpu>=1.15.1",
    "openai>=3.14.1",
    "pydantic>=2.13.5",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "sentence-transformers>=6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "integration: tests requiring external model downloads or heavy runtime dependencies",
]
